[project]
name = "epigenetic"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "pandas>=3.0.1",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "statsmodels>=0.14.5",
    "mlstatkit>=0.1.91",
    "scikit-learn>=1.8.0",
    "imbalanced-learn>=0.14.1",
    "boruta>=0.4.3",
    "xgboost>=3.2.0",
    "matplotlib>=3.10.8",
    "pymupdf>=1.28.0",
    "openpyxl>=3.1.5",
    "torch>=2.11.0",
    "coral-pytorch>=1.4.0",
    "mord>=0.7",
    "ogboost>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 120
extend-exclude = ["helper", "../other_scripts"]

[tool.ruff.lint]
select = ["F", "E", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130

